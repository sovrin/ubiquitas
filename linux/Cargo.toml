[package]
name = "ubiquitas"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_10"] }
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.0", features = ["input_capture"] }
evdev = "0.13.2"
futures-util = "0.3.34"
reis = { version = "0.7.1", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "net"] }
